<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · OverMem 插件运行时</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="login-body">
  <div class="login-wrap">
    <div class="login-brand">
      <span class="logo">OM</span>
      <span class="login-title">OverMem</span>
    </div>

    <div class="login-card">
      <h1>登录插件运行时控制台</h1>
      <p class="sub" id="login-sub">使用 API Key 换取访问令牌</p>

      <form id="login-form" autocomplete="off">
        <label for="api-key">API Key</label>
        <input id="api-key" name="api-key" type="password" placeholder="粘贴 API Key 或 JWT" spellcheck="false" autofocus />
        <button class="primary" id="login-btn" type="submit">登录</button>
        <p class="hint" id="login-hint">API Key 可在运行时的 <code>data/bootstrap_key.txt</code> 中找到，或由 <code>OVERMEM_BOOTSTRAP_KEY</code> 指定。</p>
      </form>

      <div class="login-error" id="login-error" hidden></div>
    </div>

    <p class="login-foot" id="login-foot">OverMem Plugin Runtime</p>
  </div>
  <script src="./login.js"></script>
</body>
</html>
